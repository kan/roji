name: tagpr-label

# Rebuilds the release pull request when a label (tagpr:minor, ...) is added to
# or removed from it: kan/tagpr-scripts' shared workflow marks the pull request
# draft and starts tagpr.yml with workflow_dispatch. What it does: "The tagpr
# workflow" in the tagpr-scripts README.
#
# The SHA is the same tagpr-scripts commit as the line in tagpr.yml. Move both
# in the pull request that runs git subtree pull (CLAUDE.md, "リリース PR
# (tagpr)"). scripts/tagpr/verify-subtree.mjs checks both lines.
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@231fe768bce55eb24fed1e10a4b27907ebf7a306
    permissions:
      actions: write        # start the tagpr workflow
      pull-requests: write  # mark the release pull request draft

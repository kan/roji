name: Release Build

# Builds the release archives and attests them. release.yml calls this and
# publishes what it hands back.
#
# The build is kept apart from the publishing job so that nothing here can
# write to the repository, the registry or the Homebrew tap: no write
# permission beyond the attestation itself, and no secrets.
#
# install.sh passes this file's path to `gh attestation verify
# --signer-workflow`. Renaming or moving it breaks installs of every release
# built from it, so add a version switch there (signer_workflow) first.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # Sigstore signing certificate for attestations
      attestations: write       # Store the build provenance attestation
      artifact-metadata: write  # Storage record for the attested artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser reads the previous tag for the changelog
          persist-credentials: false

      # No cache: a cache written by another workflow must not reach the
      # binaries that get attested.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      # The token is this job's read-only one; the changelog is generated
      # from the GitHub API.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # An exact version, not a range. The archives are gzip-compressed by
          # GoReleaser, and the bytes that come out differ between versions:
          # v1.4.0 rebuilt from its tag has identical binaries and tar streams
          # under v2.13.3 and v2.18.3 and different .tar.gz checksums. Rerunning
          # this workflow for a tag has to give the archives it gave the first
          # time, and a range lets a GoReleaser release in between change them.
          #
          # dependabot updates the action above, not this. Raise it by hand,
          # between releases.
          version: "v2.18.3"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # checksums.txt lists every archive, so each one becomes a subject.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # if-no-files-found below only fires when nothing matches at all. Stop
      # here if a GoReleaser update moved one of the files the publish job
      # reads, before anything is released.
      - name: Check release files
        run: |
          ls dist/checksums.txt dist/CHANGELOG.md dist/homebrew/Casks/roji.rb \
            dist/roji_Linux_x86_64.tar.gz dist/roji_Linux_arm64.tar.gz

      # Paths are kept relative to dist/
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/CHANGELOG.md
            dist/homebrew/Casks/roji.rb
          retention-days: 1
          if-no-files-found: error

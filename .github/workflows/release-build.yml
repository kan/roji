name: Release Build

# Builds the release archives and attests them. release.yml calls this and
# publishes what it hands back.
#
# The build is kept apart from the publishing job so that nothing here can
# write to the repository, the registry or the Homebrew tap: no write
# permission beyond the attestation itself, and no secrets.
#
# install.sh passes this file's path to `gh attestation verify
# --signer-workflow`. Renaming or moving it breaks installs of every release
# built from it, so add a version switch there (signer_workflow) first.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # Sigstore signing certificate for attestations
      attestations: write       # Store the build provenance attestation
      artifact-metadata: write  # Storage record for the attested artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # GoReleaser resolves the current and previous tags
          persist-credentials: false

      # No cache: a cache written by another workflow must not reach the
      # binaries that get attested.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      # GoReleaser's version is the one in tools/release/go.mod, checked
      # against go.sum, and it is part of the tag's tree: rerunning this
      # workflow for a tag uses the version the first run used. The archives
      # are gzip-compressed by GoReleaser, and the bytes that come out can
      # differ between versions (v1.4.0 rebuilt from its tag under v2.13.3 and
      # v2.18.3 gave different .tar.gz checksums), so Dependabot's updates of
      # it are merged between releases. GoReleaser is compiled here by the Go
      # that setup-go installs from the go line, so a change of the go line
      # can change the archives too.
      #
      # No token: nothing is published here, and the release notes come from
      # CHANGELOG.md in the publish job, not from GoReleaser.
      - name: Run GoReleaser
        run: go tool -modfile=tools/release/go.mod goreleaser release --clean --skip=publish

      # checksums.txt lists every archive, so each one becomes a subject.
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # if-no-files-found below only fires when nothing matches at all. Stop
      # here if a GoReleaser update moved one of the files the publish job
      # reads, before anything is released.
      - name: Check release files
        run: |
          ls dist/checksums.txt dist/homebrew/Casks/roji.rb \
            dist/roji_Linux_x86_64.tar.gz dist/roji_Linux_arm64.tar.gz

      # Paths are kept relative to dist/
      - name: Upload release files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/homebrew/Casks/roji.rb
          retention-days: 1
          if-no-files-found: error

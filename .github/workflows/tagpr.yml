name: tagpr

# Keeps the release pull request up to date and starts the release once it is
# merged. Settings are in .tagpr; the release steps are in CLAUDE.md.
#
# The tagpr job is kan/tagpr-scripts' shared workflow (scripts/tagpr/
# .github/workflows/tagpr.yml is a copy of it). What it does and how to recover
# when it fails: "The tagpr workflow" in the tagpr-scripts README.
#
# - Each push to main rebuilds the release PR (branch tagpr-from-v<previous>)
#   on top of main. scripts/release-prepare.sh stamps the CHANGELOG section
#   (with scripts/tagpr/release-prepare.mjs) and refreshes CREDITS. A failed
#   run turns the release PR into a draft (what happens next is in the README).
# - When the release PR is merged, the next run puts an annotated tag on the
#   merge commit and starts release.yml on that tag with workflow_dispatch (a
#   tag pushed with GITHUB_TOKEN does not trigger push). Dispatching on the tag,
#   rather than calling release.yml from this run, keeps github.ref at
#   refs/tags/vX.Y.Z, which the build provenance records and install.sh checks
#   with --source-ref.
# - workflow_dispatch rebuilds the release PR. tagpr-label.yml starts it when a
#   label (tagpr:minor, ...) is added to or removed from the release PR, so keep
#   this file's name and the workflow_dispatch trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No concurrency here. The shared workflow's tagpr job queues the runs; a group
# of the same name on the caller too is stopped by GitHub as a deadlock.
jobs:
  # gocredits is third-party code, so it runs here, with a read-only token,
  # and hands its output to the tagpr job as an artifact. Nothing in the tagpr
  # job, which can push to the repository, runs code from dependencies.
  credits:
    name: Generate CREDITS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No cache: a cache written by another workflow must not reach what the
      # tagpr job commits.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Generate CREDITS
        run: |
          mkdir -p "$RUNNER_TEMP/credits"
          go tool gocredits . > "$RUNNER_TEMP/credits/CREDITS"

      - name: Upload CREDITS
        uses: actions/upload-artifact@v7.0.2
        with:
          name: credits
          path: ${{ runner.temp }}/credits/CREDITS
          retention-days: 1
          if-no-files-found: error

  tagpr:
    needs: credits
    # The run that tags a merged release PR does not use CREDITS, so a failed
    # credits job must not keep it from tagging. Without the artifact,
    # scripts/release-prepare.sh fails before it writes anything.
    if: ${{ !cancelled() }}
    # The SHA is the tagpr-scripts commit pulled into scripts/tagpr/. Move it in
    # the pull request that runs git subtree pull (CLAUDE.md, "リリース PR
    # (tagpr)"). actions.lock does not pin reusable workflows from other
    # repositories, and Dependabot is kept off this line (dependabot.yml).
    uses: kan/tagpr-scripts/.github/workflows/tagpr.yml@231fe768bce55eb24fed1e10a4b27907ebf7a306
    # The most the shared workflow may use. List all four.
    permissions:
      contents: write       # Push the release branch and the tag
      pull-requests: write  # Open and update the release PR
      issues: read          # Read labels
      actions: write        # workflow_dispatch release.yml
    with:
      release-workflow: release.yml
      # Read by scripts/release-prepare.sh as TAGPR_ARTIFACT_DIR/CREDITS
      artifact: credits

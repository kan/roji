name: Deploy Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-site.yml']
  # Build only, so a change that breaks the site fails on the pull request
  # instead of in the deploy after the merge
  pull_request:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

# The deploy job lists what it needs. The build job runs for pull requests
# and stays read-only.
permissions:
  contents: read

# A new push to a pull request supersedes its running build. Runs on main are
# not cancelled; the deploy job has its own group below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          # Pinned: Hugo removes deprecated config keys, and 'latest' broke the
          # build when v0.168.0 dropped module.mounts.lang. Raise it by hand,
          # after checking the build for new deprecation warnings.
          hugo-version: '0.168.0'
          extended: true

      # thulite 3 compiles Sass with Dart Sass, which Hugo finds on PATH.
      # Pinned with its checksum like Hugo above: Dart Sass 3.0 removes the
      # @import rules the theme and Bootstrap still use. Raise it by hand.
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: '1.106.1'
          DART_SASS_SHA256: 'ad99cccb90de4ad2926e03e32d819c83baf32c3dbff56da92df0eed10e604d60'
        run: |
          archive="$RUNNER_TEMP/dart-sass.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Build website
        working-directory: ./website
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # GitHub's publish step usually takes seconds, but has taken over the
          # 10 minute default, failing the job for a deployment that then
          # reported "succeed" and went live minutes later.
          timeout: 1800000 # 30 minutes

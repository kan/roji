name: Release

# tagpr.yml starts this with workflow_dispatch on the tag it pushed (a tag
# pushed with GITHUB_TOKEN does not trigger push). The push trigger is for a
# tag pushed by hand. Either way github.ref is the tag, which the build
# provenance records and install.sh checks with --source-ref.
#
# The build and the GitHub release are kan/tagpr-scripts' shared workflows
# (copies in scripts/tagpr/.github/workflows/). What they check, their inputs
# and how to re-run them: "The Go release workflows" in the tagpr-scripts README.
#
#   test -> build (build-go.yml) -> docker -> release (release-go.yml) -> homebrew
#
# - build-go.yml checks the tag, its CHANGELOG section and CREDITS, builds the
#   archives and attests them. The attestations are signed by
#   kan/tagpr-scripts/.github/workflows/build-go.yml (install.sh's
#   signer_workflow switches on the version).
# - The Docker image is pushed before the release is made: if the release
#   fails, a re-run makes the draft again, and the image tags can be pushed
#   again; a published release cannot be changed (immutable releases).
# - The Homebrew cask is updated after the release is published: it points at
#   the release's download URLs, which do not resolve while it is a draft.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

# One run per tag. Not cancelled: a run stopped while publishing would leave
# a half-done release. The shared workflows have no concurrency of their own.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run tests before releasing
  test:
    # workflow_dispatch can be started on a branch; release only tags. The
    # shared workflows check this too, and every other job depends on this one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run integration tests
        working-directory: ./test
        run: go test -v -tags=integration -timeout=5m ./...

      - name: Run E2E tests
        working-directory: ./test
        run: go test -v -tags=e2e -timeout=5m ./...

  # The SHAs are the tagpr-scripts commit pulled into scripts/tagpr/, the same
  # as tagpr.yml (verify-subtree.mjs checks these lines too).
  build:
    needs: test
    uses: kan/tagpr-scripts/.github/workflows/build-go.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: read
      id-token: write           # Sigstore signing certificate for attestations
      attestations: write       # Store the build provenance attestation
      artifact-metadata: write  # Storage record for the attested artifacts
    with:
      # Not attached to the release; the homebrew job pushes it to the tap
      extra-files: homebrew/Casks/roji.rb

  # The image holds the binaries of the attested archives. Nothing is compiled
  # here.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Push the Docker image
    env:
      TAG: ${{ github.ref_name }}
      # A tag with a pre-release suffix (v1.2.3-rc.1) gets a versioned image
      # but not the image's latest tag, nor the Homebrew cask, which would hand
      # it to everyone.
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      # For Dockerfile.goreleaser and the license files copied into the image
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Set image metadata
        id: meta
        run: |
          {
            echo "version=${TAG#v}"
            echo "commit_date=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile.goreleaser copies ${TARGETPLATFORM}/roji, so lay the
      # binaries out as linux/amd64/roji and linux/arm64/roji. They come out
      # of the attested archives, so the image holds the same binaries.
      - name: Prepare Docker build context
        run: |
          ctx="$RUNNER_TEMP/docker"
          for pair in amd64:x86_64 arm64:arm64; do
            mkdir -p "$ctx/linux/${pair%%:*}"
            tar -xzf "dist/roji_Linux_${pair##*:}.tar.gz" -C "$ctx/linux/${pair%%:*}" roji
          done
          cp LICENSE CREDITS THIRD_PARTY_NOTICES "$ctx/"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ runner.temp }}/docker
          file: Dockerfile.goreleaser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kan/roji:${{ steps.meta.outputs.version }}
            ${{ env.PRERELEASE != 'true' && 'ghcr.io/kan/roji:latest' || '' }}
          # The fixed labels (source, licenses) are in the Dockerfile
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.commit_date }}
            org.opencontainers.image.title=roji
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  # Creates the release as a draft with the archives and publishes it. install.sh
  # refuses a release whose archives have no attestation; build-go.yml has
  # attested them by then.
  release:
    needs: [build, docker]
    uses: kan/tagpr-scripts/.github/workflows/release-go.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: write  # Create and publish the release
    with:
      prerelease: ${{ needs.build.outputs.prerelease }}
      # {version} is the version without the v
      notes-footer: |
        ## Docker Image

        ```bash
        docker pull ghcr.io/kan/roji:{version}
        ```

        ## Homebrew (macOS)

        ```bash
        brew install kan/roji/roji
        ```

        ## Quick Install

        ```bash
        curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/kan/roji/main/install.sh | bash -s -- --version {version}
        ```

  homebrew:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release files
        if: needs.build.outputs.prerelease != 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Update Homebrew cask
        if: needs.build.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cask=Casks/roji.rb
          # Updating a file needs its current blob SHA
          sha=$(gh api "repos/kan/homebrew-roji/contents/$cask" --jq .sha)
          gh api -X PUT "repos/kan/homebrew-roji/contents/$cask" --silent \
            -f "message=Brew cask update for roji version $TAG" \
            -f "content=$(base64 -w0 "dist/homebrew/$cask")" \
            -f "sha=$sha"

      - name: Trigger pkg.go.dev update
        run: |
          echo "Requesting pkg.go.dev to index $TAG"
          curl -f "https://proxy.golang.org/github.com/kan/roji/@v/$TAG.info" || true

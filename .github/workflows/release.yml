name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # Run tests before releasing
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run integration tests
        working-directory: ./test
        run: go test -v -tags=integration -timeout=5m ./...

      - name: Run E2E tests
        working-directory: ./test
        run: go test -v -tags=e2e -timeout=5m ./...

  release:
    needs: test  # Wait for tests to pass before releasing
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so repeat them
    permissions:
      contents: write
      packages: write
      id-token: write           # Sigstore signing certificate for attestations
      attestations: write       # Store the build provenance attestation
      artifact-metadata: write  # Storage record for the attested artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # install.sh verifies archives with `gh attestation verify --repo kan/roji`.
      # checksums.txt lists every archive, so each one becomes a subject.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      # GoReleaser leaves the release as a draft (.goreleaser.yml), so
      # /releases/latest keeps pointing at the previous version until the
      # attestation exists. If attesting fails, the release stays a draft.
      - name: Publish release
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Trigger pkg.go.dev update
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Requesting pkg.go.dev to index $VERSION"
          curl -f "https://proxy.golang.org/github.com/kan/roji/@v/$VERSION.info" || true
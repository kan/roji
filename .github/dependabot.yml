# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    ignore:
      # tagpr.yml が呼ぶ kan/tagpr-scripts の共通の workflow の SHA は、
      # scripts/tagpr/ の subtree と揃える。subtree pull と同じ PR でだけ上げ、
      # Dependabot には上げさせない（tagpr-scripts の README「The tagpr workflow」）
      - dependency-name: "kan/tagpr-scripts*"

  # Documentation website (Hugo + Thulite)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    ignore:
      # 2.4.4 の robots.txt が、生成されない sitemap-index.xml を指すため、
      # package.json で 2.4.3 に固定している（CLAUDE.md「公式サイト」）。
      # 直った版が出たら、package.json と一緒にこの ignore を外す
      - dependency-name: "@thulite/seo"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 3

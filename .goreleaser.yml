# GoReleaser configuration
# Documentation: https://goreleaser.com/customization/
#
# GoReleaser only builds: release-build.yml runs it with --skip=publish.
# release.yml creates the GitHub release, pushes the Docker image and updates
# the Homebrew tap from the files in dist/, so the build runs without the
# permissions and secrets that publishing needs.
#
# The build is reproducible: the same tag gives the same archives. Timestamps
# come from the commit, not from the clock.
version: 2

project_name: roji

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: roji
    main: ./cmd/roji
    binary: roji
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kan/roji/cmd/roji/cmd.Version={{.Version}}
      - -X github.com/kan/roji/cmd/roji/cmd.Commit={{.Commit}}
      - -X github.com/kan/roji/cmd/roji/cmd.Date={{.CommitDate}}
      - -X github.com/kan/roji/cmd/roji/cmd.BuiltBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: roji
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # Files would otherwise carry the time of the checkout, and the user and
    # umask of whoever ran the build
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &reproducible_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: CREDITS
        info: *reproducible_info
      - src: THIRD_PARTY_NOTICES
        info: *reproducible_info
      - src: README.md
        info: *reproducible_info
      - src: CHANGELOG.md
        info: *reproducible_info

# Only generates dist/homebrew/Casks/roji.rb; release.yml pushes it to the tap
homebrew_casks:
  - name: roji
    ids:
      - roji
    binaries:
      - roji
    homepage: "https://github.com/kan/roji"
    description: "A simple reverse proxy for local development. Auto-discovers Docker Compose services and provides HTTPS access via *.dev.localhost."
    caveats: |
      After installation, run:
        sudo roji doctor --fix
        sudo roji ca install
        sudo roji service install && sudo roji service start
    repository:
      owner: kan
      name: homebrew-roji

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactoring'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: 'Security'
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: 'Other'
      order: 999

# The cask's download URLs are built from this
release:
  github:
    owner: kan
    name: roji

# Announce releases to social media (optional)
announce:
  skip: true

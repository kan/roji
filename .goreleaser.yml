# GoReleaser configuration
# Documentation: https://goreleaser.com/customization/
version: 2

project_name: roji

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: roji
    main: ./cmd/roji
    binary: roji
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kan/roji/cmd/roji/cmd.Version={{.Version}}
      - -X github.com/kan/roji/cmd/roji/cmd.Commit={{.Commit}}
      - -X github.com/kan/roji/cmd/roji/cmd.Date={{.Date}}
      - -X github.com/kan/roji/cmd/roji/cmd.BuiltBy=goreleaser

archives:
  - id: roji
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactoring'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: 'Security'
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: 'Other'
      order: 999

dockers_v2:
  - id: roji
    images:
      - "ghcr.io/kan/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/kan/roji"
      org.opencontainers.image.licenses: "MIT"

release:
  github:
    owner: kan
    name: roji
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ## Docker Image
    
    ```bash
    docker pull ghcr.io/kan/roji:{{.Version}}
    ```
    
    ## Quick Install
    
    ```bash
    curl -fsSL https://raw.githubusercontent.com/kan/roji/v{{.Version}}/install.sh | bash
    ```

# Announce releases to social media (optional)
announce:
  skip: true